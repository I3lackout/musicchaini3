name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  cloud-checks:
    name: Cloud configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install isolated test dependencies
        run: bash scripts/cloud/install.sh

      - name: Run syntax checks and unit tests
        run: bash scripts/cloud/test.sh
